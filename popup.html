<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Info Collector</title>
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #a855f7;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --accent: #22d3ee;
    }

    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .section:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .copy-btn:hover {
      opacity: 1;
    }

    .scan-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .scan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .empty-state {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      padding: 10px;
    }

    /* Scrollbar */
    .list::-webkit-scrollbar {
      width: 4px;
    }
    .list::-webkit-scrollbar-track {
      background: transparent;
    }
    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Web Collector</h1>
      <button id="scanBtn" class="scan-btn" style="width: auto; padding: 6px 12px;">Scan Page</button>
    </header>

    <div class="section">
      <div class="section-header">📧 Emails</div>
      <div id="emailList" class="list">
        <div class="empty-state">No emails found</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">📱 Phone Numbers</div>
      <div id="phoneList" class="list">
        <div class="empty-state">No phone numbers found</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">🔗 Social Media</div>
      <div id="socialList" class="list">
        <div class="empty-state">No social links found</div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
